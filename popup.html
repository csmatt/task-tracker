<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link href="./styles.css" rel="stylesheet">
</head>

<body>

  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
          <path
            d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z" />
        </svg>
      </div>
      <h1>Task Tracker</h1>
    </div>
    <div class="global-btns">
      <button class="global-btn" id="addBtn" title="Create a new timer">
        <svg viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        New Timer
      </button>
      <button class="global-btn" id="resetAllBtn" title="Reset all timers">
        <svg viewBox="0 0 24 24">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 1 0 .49-3.52" />
        </svg>
      </button>
    </div>
  </header>

  <div class="new-timer-form" id="newTimerForm">
    <input type="text" id="timerNameInput" placeholder="Timer name..." maxlength="30" />
    <button class="form-cancel" id="cancelBtn">✕</button>
    <button class="form-confirm" id="confirmBtn">Add</button>
  </div>

  <div class="top-bar">
    <div class="total-time" id="totalTime">0m</div>
    <input type="text" class="search-input" id="searchInput" placeholder="Search timers..." />
  </div>

  <div class="tag-filter-bar" id="tagFilter"></div>

  <div class="timer-list" id="timerList">
    <div class="empty-state" id="emptyState">
      <div class="empty-icon">⏱</div>
      <p>No timers yet.<br>Click <strong>New Timer</strong> to get started.</p>
    </div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
